name: Publish Mission screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mission-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZIPFORM_TOKEN: ${{ secrets.ZIPFORM_TOKEN }}
      TLOZ_MISSION_ID: ${{ vars.TLOZ_MISSION_ID }}
      APP_BASE_URL: http://127.0.0.1:3000
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run screenshots:publish
