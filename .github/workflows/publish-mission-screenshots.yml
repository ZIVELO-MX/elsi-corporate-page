name: Publish Mission screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mission-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check publication credentials
        id: credentials
        env:
          ZIPFORM_TOKEN: ${{ secrets.ZIPFORM_TOKEN }}
        run: |
          if [ -z "$ZIPFORM_TOKEN" ]; then
            echo "Skipping: ZIPFORM_TOKEN is not configured"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve screenshot request
        id: resolve
        if: steps.credentials.outputs.skip != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/screenshots/resolve-pr.mjs

      - if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        run: pnpm playwright install --with-deps chromium

      - name: Build screenshot application
        if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        run: pnpm build

      - name: Capture and publish screenshots
        if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true'
        env:
          ZIPFORM_TOKEN: ${{ secrets.ZIPFORM_TOKEN }}
          MISSION_DISPLAY_ID: ${{ steps.resolve.outputs.display_id }}
          SCREENSHOT_PROFILE: ${{ steps.resolve.outputs.profile }}
          APP_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm admin:operations:e2e
          pnpm screenshots:publish

      - name: Comment on pull request
        if: steps.credentials.outputs.skip != 'true' && steps.resolve.outputs.skip != 'true' && success()
        uses: actions/github-script@v7
        env:
          MISSION_DISPLAY_ID: ${{ steps.resolve.outputs.display_id }}
          SCREENSHOT_PROFILE: ${{ steps.resolve.outputs.profile }}
        with:
          script: |
            const marker = "<!-- elsi-mission-screenshots -->";
            const missionUrl = `https://zipform.zivelo.dev/tloz/elsi/${process.env.MISSION_DISPLAY_ID}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "### Capturas publicadas",
              "",
              `Las capturas de \`${process.env.SOURCE_REVISION}\` se publicaron en [${process.env.MISSION_DISPLAY_ID}](${missionUrl}).`,
              "",
              `Perfiles: \`${process.env.SCREENSHOT_PROFILE}\` · [Ver ejecución](${runUrl})`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - if: steps.credentials.outputs.skip == 'true' || steps.resolve.outputs.skip == 'true'
        run: echo "✓ Screenshots not applicable — skipping."
